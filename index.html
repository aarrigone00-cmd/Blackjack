<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blackjack</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="login" id="login" hidden>
    <h1>Blackjack</h1>
    <p>Sign in to take a seat at the table.</p>
    <button id="google-signin" class="google-btn">
      <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Sign in with Google
    </button>
    <p class="message error" id="login-error" role="alert"></p>
  </section>

  <div class="app" id="app" hidden>
    <div class="user-bar">
      <img id="user-avatar" class="avatar" alt="" referrerpolicy="no-referrer" hidden />
      <span class="greeting" id="greeting"></span>
      <button id="signout" class="secondary small">Sign out</button>
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-table" data-tab="table" aria-selected="true" aria-controls="table">Table</button>
      <button class="tab" role="tab" id="tab-profile" data-tab="profile" aria-selected="false" aria-controls="profile">Profile</button>
    </nav>

  <main class="table" id="table" role="tabpanel" aria-labelledby="tab-table">
    <header class="top">
      <h1>Blackjack</h1>
      <div class="stats">
        <span>Bank: <strong id="bank">$1000</strong></span>
        <span>Bet: <strong id="bet">$0</strong></span>
        <span>Cards left: <strong id="remaining">–</strong></span>
      </div>
    </header>

    <section class="hand">
      <h2>Dealer <span class="score" id="dealer-score"></span></h2>
      <div class="cards" id="dealer-cards"></div>
    </section>

    <p class="message" id="message" role="status" aria-live="polite">Loading deck…</p>

    <section class="hand">
      <h2>You <span class="score" id="player-score"></span></h2>
      <div class="cards" id="player-cards"></div>
    </section>

    <section class="controls">
      <div class="betting" id="betting">
        <button class="chip" data-chip="10">+10</button>
        <button class="chip" data-chip="25">+25</button>
        <button class="chip" data-chip="100">+100</button>
        <button id="clear-bet" class="secondary">Clear</button>
        <button id="deal" class="primary">Deal</button>
      </div>
      <div class="actions" id="actions" hidden>
        <button id="hit" class="primary">Hit</button>
        <button id="stand" class="primary">Stand</button>
        <button id="double" class="secondary">Double</button>
      </div>
      <button id="reset" class="link" hidden>Out of money — start over</button>
    </section>
  </main>

  <section class="profile" id="profile" role="tabpanel" aria-labelledby="tab-profile" hidden>
    <p class="profile-loading" id="profile-loading">Loading your profile…</p>
    <form id="profile-form" class="profile-card" novalidate hidden>
      <h2 id="profile-heading">Create your profile</h2>
      <p class="hint" id="profile-intro">Pick a username and tell the table a little about yourself.</p>

      <div class="profile-photo">
        <img id="profile-preview" class="avatar large" alt="Profile photo preview" referrerpolicy="no-referrer" />
        <label class="field grow">
          <span>Photo URL</span>
          <input id="pf-avatar" type="url" maxlength="1000" placeholder="https://…" />
          <small class="hint">Defaults to your Google photo. Leave blank for none.</small>
        </label>
      </div>

      <label class="field">
        <span>Username</span>
        <input id="pf-username" required minlength="3" maxlength="20" autocomplete="username"
               autocapitalize="none" spellcheck="false" placeholder="ace_of_spades" />
        <small class="hint">3–20 characters: lowercase letters, numbers, underscores.</small>
      </label>

      <label class="field">
        <span>Display name</span>
        <input id="pf-display" required maxlength="50" autocomplete="name" />
      </label>

      <label class="field">
        <span>Bio <small class="hint" id="pf-bio-count">0/280</small></span>
        <textarea id="pf-bio" rows="3" maxlength="280" placeholder="Hit on 16? Always."></textarea>
      </label>

      <p class="message" id="profile-message" role="status" aria-live="polite"></p>
      <div class="profile-actions">
        <button type="submit" class="primary" id="profile-save">Create profile</button>
      </div>
      <p class="hint member-since" id="member-since"></p>
    </form>
  </section>
  </div>

  <footer>Cards from <a href="https://deckofcardsapi.com/" target="_blank" rel="noopener">deckofcardsapi.com</a></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
